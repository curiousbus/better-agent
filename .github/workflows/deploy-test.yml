name: Deploy test (Workers)

# Pushing to `dev` deploys the server + web + admin to Cloudflare Workers
# (test env, Postgres on Neon). No local deploys.
on:
  push:
    branches: [dev]
  workflow_dispatch: {}

concurrency:
  group: deploy-test
  cancel-in-progress: true

env:
  SERVER_URL: https://better-agent-server.jacksonwen001.workers.dev

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check-types
      - name: Migrate test database
        run: pnpm -F @better-agent/db exec drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Seed built-in admin
        run: pnpm -F server exec tsx src/seed-admin.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
      - name: Deploy server
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            DATABASE_URL
            AUTH_JWT_SECRET
            CREDENTIALS_SECRET
            CORS_ORIGIN
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          CREDENTIALS_SECRET: ${{ secrets.CREDENTIALS_SECRET }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}

  authz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate authz database
        run: pnpm -F authz exec drizzle-kit migrate
        env:
          AUTHZ_DATABASE_URL: ${{ secrets.AUTHZ_DATABASE_URL }}
      - name: Seed authz admin
        run: pnpm -F authz exec tsx src/seed-admin.ts
        env:
          AUTHZ_DATABASE_URL: ${{ secrets.AUTHZ_DATABASE_URL }}
          AUTHZ_ADMIN_EMAIL: ${{ secrets.AUTHZ_ADMIN_EMAIL }}
          AUTHZ_ADMIN_PASSWORD: ${{ secrets.AUTHZ_ADMIN_PASSWORD }}
      - name: Deploy authz
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/authz
          command: deploy
          secrets: |
            AUTHZ_DATABASE_URL
            AUTHZ_JWT_SECRET
            AUTHZ_SERVICE_SECRET
            MAIN_SERVER_URL
        env:
          AUTHZ_DATABASE_URL: ${{ secrets.AUTHZ_DATABASE_URL }}
          AUTHZ_JWT_SECRET: ${{ secrets.AUTHZ_JWT_SECRET }}
          AUTHZ_SERVICE_SECRET: ${{ secrets.AUTHZ_SERVICE_SECRET }}
          MAIN_SERVER_URL: ${{ secrets.MAIN_SERVER_URL }}

  frontends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build ${{ matrix.app }} (SPA shell)
        run: pnpm -F ${{ matrix.app }} build
        env:
          VITE_SERVER_URL: ${{ env.SERVER_URL }}
      - name: Promote shell to index.html (SPA fallback)
        run: cp .output/public/_shell.html .output/public/index.html
        working-directory: apps/${{ matrix.app }}
      - name: Deploy ${{ matrix.app }}
        run: pnpm exec wrangler deploy
        working-directory: apps/${{ matrix.app }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
