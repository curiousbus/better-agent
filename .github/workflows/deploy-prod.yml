name: Deploy prod (k3s)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Lowercased owner/repo prefix for image names.
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/better-agent

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: server
            dockerfile: deploy/docker/server.Dockerfile
            build_args: ""
          - name: web
            dockerfile: deploy/docker/app.Dockerfile
            build_args: |
              APP=web
              VITE_SERVER_URL=${{ vars.PROD_API_URL }}
          - name: admin
            dockerfile: deploy/docker/app.Dockerfile
            build_args: |
              APP=admin
              VITE_SERVER_URL=${{ vars.PROD_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl + kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.PROD_KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl version --client

      - name: Decrypt + apply secrets (sops/age)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          curl -sSL -o /usr/local/bin/sops \
            https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          chmod +x /usr/local/bin/sops
          kubectl apply -f deploy/k8s/base/namespace.yaml
          sops -d deploy/secrets/prod.secrets.yaml | kubectl apply -f -

      - name: Pin images to this sha
        working-directory: deploy/k8s/overlays/prod
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          ./kustomize edit set image \
            ghcr.io/OWNER/better-agent-server=${{ env.IMAGE_PREFIX }}-server:${{ github.sha }} \
            ghcr.io/OWNER/better-agent-web=${{ env.IMAGE_PREFIX }}-web:${{ github.sha }} \
            ghcr.io/OWNER/better-agent-admin=${{ env.IMAGE_PREFIX }}-admin:${{ github.sha }}

      - name: Run DB migration (gate)
        run: |
          kubectl -n better-agent delete job migrate --ignore-not-found
          sed "s|ghcr.io/OWNER/better-agent-server:latest|${{ env.IMAGE_PREFIX }}-server:${{ github.sha }}|" \
            deploy/k8s/base/migrate-job.yaml | kubectl apply -f -
          kubectl -n better-agent wait --for=condition=complete --timeout=180s job/migrate || {
            echo "::error::migration failed"; kubectl -n better-agent logs job/migrate; exit 1; }

      - name: Roll out
        run: |
          kubectl apply -k deploy/k8s/overlays/prod
          kubectl -n better-agent rollout status deploy/server --timeout=180s
          kubectl -n better-agent rollout status deploy/web --timeout=180s
          kubectl -n better-agent rollout status deploy/admin --timeout=180s
