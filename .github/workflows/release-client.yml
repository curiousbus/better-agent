name: Release client (GitHub Packages)

# Push a tag like `client-v0.1.0` to build + publish @curiousbus/agent-client
# to GitHub Packages. Uses the automatic GITHUB_TOKEN — no manual secret needed.
on:
  push:
    tags:
      - "client-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@curiousbus"
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -F @curiousbus/agent-client check-types
      - name: Test
        run: pnpm -F @curiousbus/agent-client test
      - name: Build
        run: pnpm -F @curiousbus/agent-client build
      - name: Publish to GitHub Packages
        run: pnpm -F @curiousbus/agent-client publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
