name: Release client (npm)

# Push a tag like `client-v0.1.0` to build + publish @curiousbus/agent-client.
# Requires an NPM_TOKEN repo secret (npm automation token with publish access
# to the @curiousbus scope).
on:
  push:
    tags:
      - "client-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -F @curiousbus/agent-client check-types
      - name: Test
        run: pnpm -F @curiousbus/agent-client test
      - name: Build
        run: pnpm -F @curiousbus/agent-client build
      - name: Publish
        run: pnpm -F @curiousbus/agent-client publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
