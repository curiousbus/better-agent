# Daily logical backup: pg_dump | gzip -> R2 (S3 API). Retention: prune in R2
# lifecycle rules (set 30d expiry on the backups/ prefix in the R2 dashboard).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: better-agent
spec:
  schedule: "20 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: alpine:3.21
              envFrom:
                - secretRef: { name: app-secrets }
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  apk add --no-cache postgresql16-client aws-cli >/dev/null
                  STAMP=$(date +%Y%m%d-%H%M%S)
                  FILE=/tmp/backup-$STAMP.sql.gz
                  pg_dump "$DATABASE_URL" | gzip > "$FILE"
                  AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
                  AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
                  aws s3 cp "$FILE" "s3://$S3_BUCKET/backups/backup-$STAMP.sql.gz" \
                    --endpoint-url "$S3_ENDPOINT"
                  echo "backup uploaded: backups/backup-$STAMP.sql.gz"
