apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: better-agent
spec:
  replicas: 2
  selector:
    matchLabels: { app: server }
  template:
    metadata:
      labels: { app: server }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app: server }
      containers:
        - name: server
          image: ghcr.io/OWNER/better-agent-server:latest
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: better-agent
spec:
  selector: { app: server }
  ports: [{ port: 80, targetPort: 3000 }]
