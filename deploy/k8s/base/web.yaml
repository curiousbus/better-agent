apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: better-agent
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: ghcr.io/OWNER/better-agent-web:latest
          ports: [{ containerPort: 3000 }]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: better-agent
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 3000 }]
