apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: better-agent
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: migrate }
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/OWNER/better-agent-server:latest
          command: ["node", "dist/migrate.mjs"]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
