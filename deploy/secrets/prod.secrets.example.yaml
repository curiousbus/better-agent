# Template for the prod Secret. Copy to prod.secrets.yaml, fill in real values,
# then encrypt IN PLACE with:  sops -e -i deploy/secrets/prod.secrets.yaml
# Never commit the plaintext file — only the sops-encrypted one.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: better-agent
stringData:
  # in-cluster postgres (user/db are fixed to better_agent in postgres.yaml)
  POSTGRES_PASSWORD: "CHANGE_ME_strong_password"
  DATABASE_URL: "postgres://better_agent:CHANGE_ME_strong_password@postgres.better-agent.svc.cluster.local:5432/better_agent"
  # crypto
  CREDENTIALS_SECRET: "CHANGE_ME_32+chars"
  AUTH_JWT_SECRET: "CHANGE_ME_32+chars"
  # email (Resend)
  RESEND_API_KEY: ""
  # attachments via R2's S3 API
  S3_ENDPOINT: "https://<account_id>.r2.cloudflarestorage.com"
  S3_BUCKET: "better-agent-uploads"
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
  # invite gating (authz stays on Workers; leave empty to disable the gate)
  AUTHZ_URL: ""
  AUTHZ_SERVICE_SECRET: ""
  # admin bootstrap
  ADMIN_EMAILS: "you@example.com"
  # google oauth (optional)
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
