name = "better-agent-server"
main = "apps/server/src/worker.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat", "fetch_iterable_type_support"]

# Non-secret vars. Secrets (DATABASE_URL, AUTH_JWT_SECRET, CREDENTIALS_SECRET,
# CORS_ORIGIN, …) are NOT here — the deploy Action uploads them from GitHub
# repo secrets onto this same worker.
[vars]
NODE_ENV = "production"

# Worker-to-worker binding to the authz service (same-account public-URL fetch
# is unreliable on Cloudflare, so the invite gate calls authz through this).
[[services]]
binding = "AUTHZ"
service = "better-agent-authz"

# Service binding to our own MCP worker (X tools). Same-account
# worker-to-worker public-URL fetch is blocked (CF 1042).
[[services]]
binding = "MCP"
service = "better-agent-mcp"

# R2 bucket for chat attachments (uploaded images/files). The bucket must exist
# (the deploy Action creates it idempotently; otherwise `wrangler r2 bucket
# create better-agent-uploads`).
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "better-agent-uploads"

# Hyperdrive (pools + accelerates Postgres) is TEMPORARILY DISABLED: its default
# query caching returned stale (empty) reads for our persist-then-read-in-one-
# request chat flow, causing "messages must not be empty" errors. Re-enable by
# turning OFF query caching on the Hyperdrive config (dashboard), then restoring:
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "e163593dbccc4b2db57eeff3471d036b"
# The worker keeps a dual-driver path: with the binding it uses node-postgres
# through Hyperdrive, without it the Neon serverless driver.
