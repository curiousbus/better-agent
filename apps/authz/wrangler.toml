name = "better-agent-authz"
main = "src/worker.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# Secrets (AUTHZ_DATABASE_URL, AUTHZ_JWT_SECRET, AUTHZ_SERVICE_SECRET,
# MAIN_SERVER_URL, …) are uploaded by the deploy Action from GitHub repo secrets.
[vars]
NODE_ENV = "production"

# The main server now runs on Node/Docker, so the revoke-invalidation push goes
# over its public URL (MAIN_SERVER_URL secret) via a normal fetch — no
# worker-to-worker binding, and no same-account 1042 blocking to work around.

# SPA via static assets; worker handles API paths first.
[assets]
directory = "./app/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/admin/*", "/service/*"]
