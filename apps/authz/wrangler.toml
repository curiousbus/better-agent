name = "better-agent-authz"
main = "src/worker.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# Secrets (AUTHZ_DATABASE_URL, AUTHZ_JWT_SECRET, AUTHZ_SERVICE_SECRET,
# MAIN_SERVER_URL, …) are uploaded by the deploy Action from GitHub repo secrets.
[vars]
NODE_ENV = "production"

# Worker-to-worker binding to the main server (for pushing cache invalidations
# on revoke; same-account public-URL fetch is unreliable on Cloudflare).
[[services]]
binding = "MAIN"
service = "better-agent-server"

# SPA via static assets; worker handles API paths first.
[assets]
directory = "./app/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/admin/*", "/service/*"]
